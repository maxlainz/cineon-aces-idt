name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Generated files up to date
        run: python tools/cineon_idt.py --check
      - name: Tests (reference, DCTL, CLF and OpenColorIO)
        run: pytest -v
